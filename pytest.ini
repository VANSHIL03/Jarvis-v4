[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    destructive: mutates real machine state (kills apps, powers off, writes outside a tmp dir). Excluded from a default run; use `pytest -m destructive` to opt in.

# A plain `pytest` must be safe to run on the developer's own laptop. Before this
# line existed, `pytest` ran tests/test_shutdown.py, which called
# close_all_user_apps() for real and taskkill'd Chrome, VS Code, Discord, Word and
# Steam. Command-line `-m` overrides this, so `pytest -m destructive` still works.
addopts = -m "not destructive"
